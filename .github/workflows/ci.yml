name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FMIX_HOME: ${{ github.workspace }}/fmix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: VitaSound/fmix
          ref: 0.7.2
          path: fmix

      # No actions/cache for /opt — prefix is hard-coded in the engine;
      # GHCR pull (~20MB) is fast enough without a host-side cache.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install GForth 0.7.9 (GHCR, else source build)
        run: bash .github/scripts/fetch-gforth-0.7.9.sh

      - name: Verify GForth version
        run: gforth --version 2>&1 | grep -F '0.7.9'

      - name: fmix packages.get
        run: |
          export PATH="${{ github.workspace }}/fmix/bin:/opt/gforth-0.7.9/bin:${PATH}"
          fmix packages.get

      - name: fmix test
        run: |
          export PATH="${{ github.workspace }}/fmix/bin:/opt/gforth-0.7.9/bin:${PATH}"
          fmix test
